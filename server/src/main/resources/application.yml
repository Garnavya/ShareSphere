server:
  port: ${SERVER_PORT:5000}

spring:
  application:
    name: sharesphere-server

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sharesphere_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:sharesphere_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:sharesphere_pass}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

jwt:
  secret: ${JWT_SECRET:supersecret_jwt_key_for_development_only_must_be_32_bytes_long}
  expiration-ms: 604800000 # 7 days in milliseconds

app:
  client-url: ${CLIENT_URL:http://localhost:5173}
