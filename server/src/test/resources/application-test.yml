spring:
  datasource:
    url: jdbc:h2:mem:sharesphere_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: supersecret_jwt_key_for_test_environment_at_least_32_bytes_long
  expiration-ms: 3600000

app:
  client-url: http://localhost:5173
